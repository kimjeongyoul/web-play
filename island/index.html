<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Floating Island Defense</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;
  background:linear-gradient(#3f8fe0 0%,#7cc4f5 45%,#c9ecff 78%,#ffe9c4 100%);color:#2b2118;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.ui{position:fixed;pointer-events:none;z-index:5}
html:not([data-state]) .ui{display:none}
.ui>*{pointer-events:auto}
.panel{background:#fff7e0;border:3px solid #2b2118;border-radius:14px;box-shadow:0 4px 0 #2b2118}
#hud{top:8px;left:8px;display:flex;gap:6px}
.pill{padding:4px 10px 5px;min-width:74px;text-align:center;transition:transform .1s}
.pill small{display:block;font-size:10px;font-weight:800;letter-spacing:1px;color:#8a6d4b;white-space:nowrap}
.pill span{font-size:20px;font-weight:900;line-height:1.05;white-space:nowrap}
.pill.bad{background:#ffb3a8;transform:scale(1.08)}
#pGold span{color:#b97a00}
#hpBar{width:84px;height:8px;background:#3a2a20;border-radius:5px;margin:2px auto 0;overflow:hidden}
#hpFill{height:100%;width:100%;background:linear-gradient(#ff7b6b,#e03131);transition:width .25s}
button{font-family:inherit;cursor:pointer;color:#2b2118}
.btn{padding:9px 16px;font-size:15px;font-weight:900;border:3px solid #2b2118;border-radius:12px;box-shadow:0 4px 0 #2b2118;background:#ffd43b;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2b2118}
.btn.off{background:#d8d0bf;color:#857a66}
.btn.blue{background:#a5d8ff}.btn.red{background:#ffa8a8}.btn.green{background:#8ce99a}
#bMenu{top:8px;right:8px;width:46px;height:46px;padding:0;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;pointer-events:auto;background:#fff7e0}
#bMenu i{display:block;width:22px;height:4px;border-radius:2px;background:#2b2118}
.tag{background:rgba(43,33,24,.82);color:#fff;border-radius:9px;padding:3px 10px;font-size:13px;font-weight:800;white-space:nowrap}
#status{top:66px;left:8px;display:none}
@media (min-width:641px) and (min-height:481px){#status{top:76px}}
#autoTag{top:62px;right:8px;color:#ffd43b;display:none}
#dock{left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
#ctl{align-self:flex-end;display:flex;gap:8px;align-items:flex-end}
#bRoar{background:#ff922b;position:relative;overflow:hidden;font-size:18px;padding:14px 20px}
#bRoar i{position:absolute;left:0;top:0;bottom:0;background:rgba(43,33,24,.45);width:0}
#bRoar span{position:relative}
#info{padding:6px 10px;display:none;gap:8px;align-items:center;white-space:nowrap;max-width:100%}
#info b{font-size:14px}
#info .btn{padding:6px 10px;font-size:13px}
#desc{max-width:100%;overflow:hidden;text-overflow:ellipsis}
#desc em{font-style:normal;color:#ffd43b}
#bar{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:100%}
.tb{position:relative;width:54px;padding:2px 0 3px;text-align:center;background:#fff7e0;border:3px solid #2b2118;border-radius:11px;box-shadow:0 3px 0 #2b2118;transition:transform .12s}
.tb img{display:block;width:40px;height:40px;margin:0 auto -2px;pointer-events:none;filter:drop-shadow(0 0 1px #2b2118)}
.tb em{display:block;font-style:normal;font-weight:900;font-size:12px;color:#8a5a00;line-height:1}
.tb u{position:absolute;left:3px;right:3px;top:2px;height:4px;border-radius:2px}
.tb.sel{background:#d3f9d8;transform:translateY(-5px)}
.tb.poor img{filter:grayscale(.9) drop-shadow(0 0 1px #2b2118);opacity:.6}.tb.poor em{color:#c92a2a}
.tb.new{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
#banner{top:20%;left:0;right:0;text-align:center;font-size:60px;font-weight:900;color:#fff;letter-spacing:2px;padding:0 8px;
  text-shadow:0 5px 0 #2b2118,3px 0 0 #2b2118,-3px 0 0 #2b2118,0 -3px 0 #2b2118,3px 5px 0 #2b2118,-3px 5px 0 #2b2118;opacity:0}
#banner.go{animation:ban 2.4s ease-out forwards}
#banner.boss{color:#ff6b6b}
@keyframes ban{0%{opacity:0;transform:scale(2.2)}12%{opacity:1;transform:scale(1)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9) translateY(-20px)}}
#toast{z-index:30;top:34%;left:0;right:0;text-align:center;opacity:0;transition:opacity .25s}
#toast span{display:inline-block;font-size:16px;padding:6px 14px}
#flash{inset:0;background:radial-gradient(transparent 45%,rgba(224,49,49,.75));opacity:0;transition:opacity .35s;z-index:4}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:20;padding:10px;background:rgba(20,14,10,.5)}
.ov.show{display:flex}
.ov .panel{padding:18px 22px;text-align:center;max-width:100%;max-height:100%;overflow-y:auto;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.ov h2{font-size:26px;font-weight:900;color:#fff;text-shadow:0 3px 0 #2b2118,2px 0 0 #2b2118,-2px 0 0 #2b2118,0 -2px 0 #2b2118}
.ov .panel h2{color:#2b2118;text-shadow:none;margin-bottom:8px}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#title{background:linear-gradient(rgba(20,14,10,.35),rgba(20,14,10,0) 40%,rgba(20,14,10,.45))}
#title h1{font-size:54px;font-weight:900;color:#fff;text-align:center;line-height:1.05;max-width:96vw;
  text-shadow:0 5px 0 #2b2118,3px 0 0 #2b2118,-3px 0 0 #2b2118,0 -3px 0 #2b2118,3px 5px 0 #2b2118,-3px 5px 0 #2b2118}
#title .btn{min-width:200px;font-size:18px}
#title #bPlay{font-size:26px;padding:12px 30px;background:#8ce99a}
.stars{font-size:18px;color:#ffd43b}
#cardRow{display:flex;gap:10px;justify-content:center;max-width:100%}
.cardx{width:196px;padding:10px 10px 12px;text-align:center;background:#fff7e0;border:4px solid #2b2118;border-radius:16px;box-shadow:0 5px 0 #2b2118;animation:pop .4s cubic-bezier(.2,1.6,.4,1) backwards}
.cardx:nth-child(2){animation-delay:.08s}.cardx:nth-child(3){animation-delay:.16s}
.cardx:hover{transform:translateY(-4px)}
.cardx img{display:block;width:64px;height:64px;margin:0 auto 4px;pointer-events:none}
.cardx small{display:block;font-size:11px;font-weight:900;letter-spacing:1px;color:#fff;border-radius:6px;padding:1px 6px;margin:0 auto 4px;width:max-content;max-width:100%}
.cardx b{display:block;font-size:17px;font-weight:900;line-height:1.1}
.cardx span{display:block;font-size:13px;color:#6b5538;font-weight:700;margin-top:3px;line-height:1.2}
#end h1{font-size:40px;font-weight:900;margin-bottom:6px}
#end.win h1{color:#e8a200}#end.lose h1{color:#c92a2a}
#end table{margin:0 auto 8px;font-size:15px;font-weight:800;border-spacing:12px 2px}
#end td:last-child{text-align:right;color:#b97a00}#end td:first-child{text-align:left}
#eStar{font-size:26px;font-weight:900;color:#e8a200;margin-bottom:10px}
#rev p{font-size:15px;font-weight:700;margin-bottom:12px;color:#6b5538}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:8px 0;font-size:15px;font-weight:800;text-align:left}
.row input[type=range]{width:140px}
.row .btn{padding:6px 14px;font-size:14px;min-width:96px}
#shopGrid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:560px;margin:6px 0 10px}
.sh{width:84px;padding:4px 2px 5px;text-align:center;background:#fff;border:3px solid #2b2118;border-radius:11px;font-size:11px;font-weight:800}
.sh img,.sh i{display:block;width:44px;height:44px;margin:0 auto}
.sh i{border-radius:8px;border:3px solid #2b2118;width:36px;height:36px;margin:4px auto}
.sh b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh em{display:block;font-style:normal;color:#b97a00;font-size:12px}
.sh.own{background:#d3f9d8}.sh.own em{color:#2b8a3e}
.sh.lock{cursor:pointer;box-shadow:0 3px 0 #2b2118}.sh.lock img{filter:grayscale(1) brightness(.7)}
.sh h3{font-size:10px}
#shop h4{font-size:13px;color:#8a6d4b;letter-spacing:1px;margin-top:4px}
@media (max-width:640px),(max-height:480px){
  .pill{min-width:58px;padding:3px 7px 4px}.pill span{font-size:17px}#hpBar{width:66px}
  .btn{padding:8px 12px;font-size:13px}#bRoar{font-size:16px;padding:12px 16px}
  .tb{width:44px;border-width:2px;border-radius:9px}.tb img{width:34px;height:34px}.tb em{font-size:11px}
  #banner{font-size:36px}#title h1{font-size:34px}#title .btn{min-width:170px;font-size:16px}#title #bPlay{font-size:22px;padding:10px 26px}
  .ov h2{font-size:20px}#end h1{font-size:30px}.ov .panel{padding:12px 14px}
  .cardx{width:170px;padding:7px 8px 9px}.cardx img{width:48px;height:48px}.cardx b{font-size:15px}.cardx span{font-size:12px}
  .sh{width:72px}

@media (max-width:640px) and (orientation:portrait){
  #cardRow{flex-direction:column;align-items:center}
  .cardx{width:min(340px,92vw);display:grid;grid-template-columns:64px 1fr;column-gap:10px;text-align:left;align-items:center;padding:9px 10px}
  .cardx img{grid-row:1/4;width:60px;height:60px;margin:0}.cardx small{margin:0 0 3px}
}
@media (max-height:480px){
  #title{gap:6px}#title h1{font-size:28px}#title .btn{padding:6px 12px}#title #bPlay{padding:8px 26px}
  #dock{gap:4px;padding:5px 8px}#bRoar{padding:9px 16px}
  #shopGrid{max-width:800px;gap:4px;margin:4px 0 6px}.sh{width:68px;padding:2px 2px 3px}.sh img{width:34px;height:34px}.sh i{width:28px;height:28px;margin:3px auto}
  .row{margin:4px 0}#end table{font-size:13px;border-spacing:12px 0}#eStar{font-size:20px;margin-bottom:6px}

</style>
</head>

</div>

  <button class="btn" id="bPlay" data-i="play"></button>

<div id="cardsM" class="ov"><h2 data-i="pick"></h2><div id="cardRow"></div><button class="btn blue" id="bReroll" data-i="reroll"></button></div>

<div id="end" class="ov"><div class="panel"><h1 id="eTitle"></h1><table id="eStats"></table><div id="eStar"></div>

<div id="set" class="ov"><div class="panel"><h2 data-i="settings"></h2>

  <div class="row"><span data-i="lang"></span><button class="btn blue" id="sLang"></button></div>
  <div class="row"><span data-i="shake"></span><button class="btn blue" id="sShake"></button></div>
  <div class="row"><span data-i="full"></span><button class="btn blue" id="sFull" data-i="full"></button></div>
  <div class="btns" style="margin-top:12px"><button class="btn red" id="sQuit" data-i="home"></button><button class="btn" id="sClose" data-i="close"></button></div></div></div>

  burst(e.x,1,e.z,0xff6b6b,16,3.5,0.18,0.8);floatText('-'+Math.min(e.d.dmg,G.maxHp),'#ff6b6b',e.x,3,e.z,1.2);sfx('hurt');
  $('flash').style.opacity=1;setTimeout(()=>{$('flash').style.opacity=0;},160);
  $('pHp').classList.add('bad');setTimeout(()=>{$('pHp').classList.remove('bad');},220);
  if(e.d.boss){e.dist=Math.min(PATH_LEN,12);e.stun=1.2;ring(e.x,0.2,e.z,0xff6b6b,0.5,5,0.6);}

}

    const dx=e.x-x,dz=e.z-z,d2=dx*dx+dz*dz;if(d2>r2||d2<m2)continue;
    const v=o&&o.strong?-e.hp:e.dist;if(v<bv){bv=v;best=e;}}

  G.roarCd=G.roarMax;hero.jump=1;shake(0.9);sfx('roar');
  const dm=(18+6*G.wave)*RUN.roarDmg;
  for(let i=0;i<enemies.length;i++){const e=enemies[i];if(!e.alive)continue;e.stun=(e.d.boss?1.2:2.4)+RUN.roarStun;damage(e,e.d.boss?dm*3:dm,'phys',2);}
  ring(HERO.x,HERO.y+0.5,HERO.z,0xffa94d,0.5,40,1.2);ring(HERO.x,0.2,HERO.z,0xffd43b,0.5,28,1.0);ring(HERO.x,HERO.y+1,HERO.z,0xffffff,0.3,14,0.7);

function updHero(dt){
  const g=hero.grp,t=G.t;
  hero.cd-=dt;if(G.roarCd>0)G.roarCd-=dt;
  const over=G.state==='over',win=G.state==='win';
  const tg=(over||win||G.state==='title')?null:findTarget(HERO.x,HERO.z,7,null);
  if(tg){const want=Math.atan2(tg.x-HERO.x,tg.z-HERO.z);let df=want-hero.yaw;while(df>Math.PI)df-=6.283;while(df<-Math.PI)df+=6.283;hero.yaw+=df*Math.min(1,dt*10);
    if(hero.cd<=0){hero.cd=0.75;hero.swing=1;const dm=16+3*G.wave;fireHoming('orb',HERO.x+Math.sin(hero.yaw)*0.5,HERO.y+2.4,HERO.z+Math.cos(hero.yaw)*0.5,tg,e=>damage(e,dm,'phys',2));}}
  if(hero.swing>0)hero.swing=Math.max(0,hero.swing-dt*3.5);
  let jy=0;
  if(hero.jump>0){hero.jump=Math.max(0,hero.jump-dt*1.6);jy=Math.sin((1-hero.jump)*Math.PI)*1.3;}
  if(win)jy=Math.abs(Math.sin(t*6))*0.7;
  g.position.y=HERO.y+jy+Math.sin(t*3)*0.02;g.rotation.y=hero.yaw+(win?Math.sin(t*3)*0.5:0);
  const sw=hero.swing;
  hero.arms[1].rotation.x=-2.7*Math.sin(sw*Math.PI)*(sw>0?1:0)+Math.sin(t*2.4)*0.12;
  hero.arms[0].rotation.x=Math.sin(t*2.4+2)*0.12-(hero.jump>0||win?2.6:0);
  if(hero.jump>0||win)hero.arms[1].rotation.x=-2.6;
  hero.arms[0].rotation.z=-0.55+(over?0.4:0);hero.arms[1].rotation.z=0.55-(over?0.4:0);
  hero.legs[0].rotation.x=jy>0.1?0.5:0;hero.legs[1].rotation.x=jy>0.1?-0.5:0;
  hero.scarf.rotation.x=0.25+Math.sin(t*5)*0.25;hero.scarf.rotation.y=Math.sin(t*3.3)*0.3;
  g.rotation.x=over?0.35:0;
}

function rollCards(){
  const pool=[],has=f=>RUN.avail.some(k=>TOWERS[k].fam===f),w=G.wave;
  SV.towers.filter(k=>RUN.avail.indexOf(k)<0&&TOWERS[k]).forEach(k=>pool.push({k:'unlock',tw:k,w:2.2}));
  FAMS.forEach(f=>{if(has(f))pool.push({k:'dmg',fam:f,w:1.1});});
  pool.push({k:'rate',w:1},{k:'range',w:1},{k:'gold',v:80+20*w,w:1.1},{k:'income',w:0.8},{k:'wall',w:0.7},{k:'roarcd',w:0.6},{k:'roardmg',w:0.6},{k:'disc',w:0.6});
  if(G.hp<G.maxHp*0.8)pool.push({k:'repair',v:6,w:1.6});
  if(has('ice')&&has('storm'))pool.push({k:'shatter',w:1});
  if(has('ice')&&has('fire'))pool.push({k:'steam',w:1});
  if(has('storm')&&has('arrow')&&!RUN.once.crit)pool.push({k:'crit',w:1});
  if(RUN.avail.indexOf('gale')>=0&&has('fire'))pool.push({k:'wild',w:1});
  const out=[];
  const take=f=>{const c=pool.filter(f);let tot=0;c.forEach(x=>tot+=x.w);if(!c.length)return;let r=rnd()*tot;for(let i=0;i<c.length;i++){r-=c[i].w;if(r<=0||i===c.length-1){out.push(c[i]);pool.splice(pool.indexOf(c[i]),1);return;}}};
  take(c=>c.k==='unlock');
  while(out.length<3&&pool.length)take(c=>!(c.k==='unlock'&&out.filter(o=>o.k==='unlock').length>=2));
  for(let i=out.length-1;i>0;i--){const j=(rnd()*(i+1))|0,t=out[i];out[i]=out[j];out[j]=t;}
  return out;
}

  case 'gold':return {tag:T('gold'),col:'#e8a200',title:T('c_gold'),desc:T('c_goldD',c.v),icon:glyph('gold','#e8a200')};
  case 'income':return {tag:T('gold'),col:'#e8a200',title:T('c_income'),desc:T('c_incomeD'),icon:glyph('income','#e8a200')};
  case 'repair':return {tag:T('castle'),col:'#e03131',title:T('c_repair'),desc:T('c_repairD',c.v),icon:glyph('heart','#ffc9c9')};
  case 'wall':return {tag:T('castle'),col:'#e03131',title:T('c_wall'),desc:T('c_wallD'),icon:glyph('wall','#adb5bd')};
  case 'roarcd':case 'roardmg':return {tag:T('roar'),col:'#f76707',title:T('c_'+c.k),desc:T('c_'+c.k+'D'),icon:glyph('roar','#ff922b')};
  case 'rate':case 'range':case 'disc':return {tag:T('c_boost'),col:'#5c7cfa',title:T('c_'+c.k),desc:T('c_'+c.k+'D'),icon:glyph(c.k,'#748ffc')};
  default:return {tag:T('c_syn'),col:'#c2255c',title:T('c_'+c.k),desc:T('c_'+c.k+'D'),icon:glyph('syn',{shatter:'#4fb8f0',steam:'#adb5bd',crit:'#f59f00',wild:'#ff7b3a'}[c.k])};
  }
}
function applyCard(c){
  switch(c.k){
  case 'unlock':RUN.avail.push(c.tw);RUN.avail.sort((a,b)=>ALL_T.indexOf(a)-ALL_T.indexOf(b));G.sel=c.tw;G.selTower=null;buildBar(c.tw);break;
  case 'dmg':RUN.fam[c.fam]*=1.25;break;
  case 'rate':RUN.rate*=1.12;break;case 'range':RUN.range*=1.1;break;
  case 'gold':G.gold+=c.v;break;case 'income':RUN.income*=1.2;break;
  case 'repair':G.hp=Math.min(G.maxHp,G.hp+c.v);break;case 'wall':G.maxHp+=5;G.hp=Math.min(G.maxHp,G.hp+5);break;
  case 'roarcd':G.roarMax*=0.8;G.roarCd=0;break;case 'roardmg':RUN.roarDmg*=1.6;RUN.roarStun+=1;break;
  case 'disc':RUN.disc*=0.9;buildBar();break;
  case 'shatter':RUN.syn.shatter*=1.6;break;case 'steam':RUN.syn.steam*=1.6;break;
  case 'crit':RUN.syn.crit=3;RUN.once.crit=1;break;case 'wild':RUN.syn.wild*=1.4;break;
  }
}

/* ---------------------------------------------------------------- self play (?auto) */
const ai={t:0.5,n:0};
const AIW={archer:1.8,cannon:1.3,frost:0.7,tesla:1.2,blizzard:0.6,gale:0.6,glacier:0.7};
function bestSpot(type){
  const r=TOWERS[type].range*RUN.range,r2=r*r,n=pathCells.length,aura=type==='frost'||type==='blizzard'||type==='gale'||type==='glacier';
  let best=null,bs=-1e9;
  cells.forEach(c=>{
    if(!canBuild(c))return;
    let s=0;const wx=c.x+0.5,wz=c.z+0.5;
    for(let i=0;i<n;i++){const dx=pathCells[i].x+0.5-wx,dz=pathCells[i].z+0.5-wz,d2=dx*dx+dz*dz;if(d2<=r2&&d2>=(TOWERS[type].minR||0)*2)s+=1+(1-i/n)*0.7;}
    for(let j=0;j<towers.length;j++){const d=Math.hypot(towers[j].c.x-c.x,towers[j].c.z-c.z);if(aura&&towers[j].type===type&&d<4.5)s-=6;else if(d<1.6)s-=0.4;}
    if(LAND[c.kind].fam===TOWERS[type].fam)s*=1.25;
    s+=Math.random()*0.5;
    if(s>bs){bs=s;best=c;}
  });
  return best;
}
function autoPickCard(){
  let bi=0,bv=-1;
  curCards.forEach((c,i)=>{let v=c.k==='unlock'?10:c.k==='repair'?(G.hp<G.maxHp*0.5?12:5):c.k==='dmg'?7:c.k==='rate'?7.5:c.k==='range'?5:c.k==='gold'?4:c.k==='wall'?4:6;v+=rnd();if(v>bv){bv=v;bi=i;}});
  pickCard(bi);
}
function autoTick(dt){
  ai.t-=dt;if(ai.t>0)return;ai.t=0.4;
  if(G.state==='prep'&&G.cd>3)G.cd=3;
  if(G.roarCd<=0&&G.state==='wave'){let danger=false;for(let i=0;i<enemies.length;i++){const e=enemies[i];if(e.dist<(e.d.boss?PATH_LEN*0.45:7)){danger=true;break;}}if(danger)roar();}
  const ups=towers.filter(t=>t.lvl<3);
  if((ai.n%3===2&&ups.length)||towers.length>=10+G.wave*2){
    if(!ups.length)return;
    ups.sort((a,b)=>upCost(a)-upCost(b));
    if(G.gold>=upCost(ups[0])){upgradeTower(ups[0]);ai.n++;}
  }else{
    const cnt={};towers.forEach(t=>{cnt[t.type]=(cnt[t.type]||0)+1;});
    let type=null,bv=1e9;RUN.avail.forEach(k=>{const v=((cnt[k]||0)+0.2)/(AIW[k]||1);if(v<bv){bv=v;type=k;}});
    if(G.gold>=tCost(type)){const c=bestSpot(type);if(c&&buildTower(type,c))ai.n++;}
  }
}

/* ---------------------------------------------------------------- update */
function update(dt){
  G.t+=dt;updChunks(dt);
  const s=G.state;
  if(s==='title'){updHero(dt);updFx(dt);return;}
  if(s==='over'||s==='win'){
    if(G.endT>0){G.endT-=dt;if(G.endT<=0)showEnd();}
    if(s==='win'&&Math.random()<dt*5)burst(3.5+R(-5,5),R(8,13),3.5+R(-5,5),[0xff6b6b,0xffd43b,0x74c0fc,0x8ce99a,0xf783ac][(Math.random()*5)|0],26,5,0.2,0.35,1.1);
    if(s==='over'&&Math.random()<dt*10)burst(3.5+R(-3,3),R(2,7),3.5+R(-3,3),0x444444,1,1.2,0.4,-0.15,1.6);
    for(let i=0;i<enemies.length;i++){const e=enemies[i];e.ph+=dt*6;e.grp.position.y=Math.abs(Math.sin(e.ph))*0.25;e.bar.visible=false;}
    updHero(dt);updShots(dt);updFx(dt);return;
  }
  if(s==='cards'||s==='revive'){
    if(AUTO){G.autoT-=dt;if(G.autoT<=0){if(s==='cards')autoPickCard();else{G.autoT=1e9;adReward(ok=>{if(ok)revive();else{show('rev',false);endGame(false);}});}}}
    updFx(dt);return;
  }
  if(s==='prep'){G.cd-=dt;if(G.cd<=0)startWave();}
  else if(s==='grow'){G.growT-=dt;if(G.growT<=0)openCards();}
  else if(s==='wave'){G.waveT+=dt;while(G.queue.length&&G.queue[0].t<=G.waveT)spawnEnemy(G.queue.shift().type);}
  if(AUTO)autoTick(dt);
  updEnemies(dt);updTowers(dt);updPools(dt);updHero(dt);updShots(dt);updFx(dt);
  if(G.state==='wave'&&!G.queue.length&&!enemies.length)waveCleared();
}

  for(const k in barEls){const o=barEls[k],cls=(G.sel===k&&!G.selTower?' sel':'')+(G.gold<tCost(k)?' poor':'');if(o.cls!==cls){o.cls=cls;o.b.classList.toggle('sel',cls.indexOf('sel')>=0);o.b.classList.toggle('poor',cls.indexOf('poor')>=0);}}
  const t=G.selTower,inf=t?'flex':'none';if(hudCache.inf!==inf){hudCache.inf=inf;$('info').style.display=inf;$('desc').style.display=t?'none':'';}
  if(t){setTxt('iName',T('t_'+t.type)+' '+T('lv',t.lvl));setTxt('bUp',t.lvl>=3?T('max'):T('upgrade',upCost(t)));
    const off=t.lvl>=3||G.gold<upCost(t);if(hudCache.uo!==off){hudCache.uo=off;$('bUp').classList.toggle('off',off);}
    setTxt('bSell',T('sell',Math.round(t.spent*0.6)));}
  else{const dk=(G.built===0&&!AUTO?'h':'')+G.sel+LANG;if(hudCache.dk!==dk){hudCache.dk=dk;const d=$('desc');d.textContent='';
      if(G.built===0&&!AUTO)d.textContent=T('hint');else{const e=document.createElement('em');e.textContent=T('t_'+G.sel);d.appendChild(e);}}}
}
function applyLang(){
  document.documentElement.lang=LANG;document.title=T('title');
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=T(el.dataset.i);});
  hudCache={};updSet();
  if(G){if(G.state==='cards')renderCards();if(G.state==='over'||G.state==='win')fillEnd();}
  if($('shop').classList.contains('show'))renderShop();
}
function updSet(){
  $('sMus').value=Math.round(SV.mus*100);$('sSfx').value=Math.round(SV.sfx*100);
  $('sLang').textContent=T('langName');$('sShake').textContent=T(SV.shake?'on':'off');
  $('tStars').textContent='★ '+SV.stars;$('shStars').textContent='★ '+SV.stars;
  if(G)$('sQuit').style.display=G.state==='title'?'none':'';
}
function renderShop(){
  const g=$('shopGrid');g.innerHTML='';updSet();
  ALL_T.concat(ALL_L).forEach(k=>{const land=ALL_L.indexOf(k)>=0,own=(land?SV.lands:SV.towers).indexOf(k)>=0,el=document.createElement(own?'div':'button');
    el.className='sh '+(own?'own':'lock');
    if(land){const i=document.createElement('i');i.style.background=LAND[k].css;el.appendChild(i);}else{const im=document.createElement('img');im.src=ICON[k];im.alt='';el.appendChild(im);}
    const b=document.createElement('b');b.textContent=T((land?'l_':'t_')+k);const e=document.createElement('em');e.textContent=own?T('owned'):'★ '+PRICE[k];
    const h=document.createElement('h3');h.textContent=land?T('lb_'+k):T('fam_'+TOWERS[k].fam);h.style.color=land?'#8a6d4b':FAMC[TOWERS[k].fam];
    el.appendChild(b);el.appendChild(h);el.appendChild(e);
    if(!own)el.addEventListener('click',()=>{if(SV.stars<PRICE[k]){toast(T('noStar'));sfx('no');return;}SV.stars-=PRICE[k];(land?SV.lands:SV.towers).push(k);save();sfx('up');renderShop();});
    g.appendChild(el);});
}

/* ---------------------------------------------------------------- buttons */
const on=(id,fn)=>$(id).addEventListener('click',e=>{auInit();fn(e);});
on('bPlay',()=>{newRun(false);sfx('card');});
on('bShop',()=>{renderShop();show('shop',true);});
on('shClose',()=>{show('shop',false);if(G.state==='title')newRun(true);});
on('bSet',()=>{updSet();show('set',true);});
on('bMenu',()=>{G.menu=true;updSet();show('set',true);});
on('sClose',()=>{G.menu=false;show('set',false);save();});
on('sQuit',()=>{G.menu=false;adMsg('gameplay_stopped');newRun(true);});
on('sLang',()=>{LANG=LANG==='ko'?'en':'ko';SV.lang=LANG;save();applyLang();});
on('sShake',()=>{SV.shake=SV.shake?0:1;save();updSet();});
on('sFull',()=>{try{if(document.fullscreenElement)document.exitFullscreen();else{const el=document.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen).call(el);}}catch(e){}});
$('sMus').addEventListener('input',e=>{auInit();SV.mus=e.target.value/100;auVol();});
$('sSfx').addEventListener('input',e=>{auInit();SV.sfx=e.target.value/100;auVol();});
$('sSfx').addEventListener('change',()=>{sfx('card');save();});$('sMus').addEventListener('change',save);
on('bRoar',()=>roar());
on('bSpd',()=>{G.spd=G.spd%3+1;sfx('tick');});
function tryUp(t){if(t.lvl>=3)return;if(!upgradeTower(t))needGold();}
on('bUp',()=>{if(G.selTower)tryUp(G.selTower);});
on('bSell',()=>{if(G.selTower){sellTower(G.selTower);G.selTower=null;}});
on('bReroll',()=>{if(G.state!=='cards'||RUN.rerolled)return;adReward(ok=>{if(!ok){toast(T('adFail'));return;}RUN.rerolled=true;curCards=rollCards();renderCards();sfx('card');});});
on('bRevY',()=>{if(G.state!=='revive')return;adReward(ok=>{if(ok)revive();else toast(T('adFail'));});});
on('bRevN',()=>{if(G.state!=='revive')return;show('rev',false);endGame(false);});
on('bDbl',()=>{adReward(ok=>{if(!ok){toast(T('adFail'));return;}SV.stars+=RUN.stars;RUN.stars*=2;save();fillEnd();$('bDbl').style.display='none';sfx('win');});});
on('bAgain',()=>newRun(false));
on('bHome',()=>newRun(true));

/* ---------------------------------------------------------------- input and camera */
const cam={theta:-0.75,phi:0.92,zoom:1,base:32,cx:7,cz:3.5,drag:false,moved:false,lx:0,ly:0,sx:0,sy:0,idle:0,ext:0};
const mouse=new THREE.Vector2(9,9),ray=new THREE.Raycaster(),ground=new THREE.Plane(new THREE.Vector3(0,1,0),0);let hasMouse=false,hover=null;
const hl=new THREE.Mesh(new THREE.PlaneGeometry(0.94,0.94),new THREE.MeshBasicMaterial({color:0x51cf66,transparent:true,opacity:0.5,depthWrite:false}));
hl.rotation.x=-Math.PI/2;hl.visible=false;scene.add(hl);
const rangeRing=new THREE.Mesh(new THREE.RingGeometry(0.975,1,72),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.75,side:THREE.DoubleSide,depthWrite:false}));
rangeRing.rotation.x=-Math.PI/2;rangeRing.visible=false;scene.add(rangeRing);
function setMouse(e){const r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;hasMouse=true;}
const pts={};let pinch=0;
const ptN=()=>Object.keys(pts).length;
function ptD(){const k=Object.keys(pts);return Math.hypot(pts[k[0]].x-pts[k[1]].x,pts[k[0]].y-pts[k[1]].y);}
function zoomBy(f){cam.zoom=clamp(cam.zoom*f,0.4,1.6);}
canvas.addEventListener('pointerdown',e=>{auInit();pts[e.pointerId]={x:e.clientX,y:e.clientY};
  if(ptN()===2){pinch=ptD();cam.moved=true;cam.idle=2.5;try{canvas.setPointerCapture(e.pointerId);}catch(_){}return;}
  cam.drag=true;cam.moved=false;cam.lx=e.clientX;cam.ly=e.clientY;cam.sx=e.clientX;cam.sy=e.clientY;setMouse(e);try{canvas.setPointerCapture(e.pointerId);}catch(_){}});
canvas.addEventListener('pointermove',e=>{
  if(pts[e.pointerId])pts[e.pointerId]={x:e.clientX,y:e.clientY};
  if(ptN()>=2&&pinch>0){const d=ptD();if(d>0){zoomBy(pinch/d);pinch=d;}cam.idle=2.5;return;}
  setMouse(e);
  if(cam.drag){
    if(!cam.moved&&Math.hypot(e.clientX-cam.sx,e.clientY-cam.sy)>7)cam.moved=true;
    if(cam.moved){cam.theta-=(e.clientX-cam.lx)*0.006;cam.phi=clamp(cam.phi-(e.clientY-cam.ly)*0.005,0.3,1.38);cam.idle=2.5;canvas.style.cursor='grabbing';}
    cam.lx=e.clientX;cam.ly=e.clientY;
  }
});
function pointerEnd(e){delete pts[e.pointerId];
  if(ptN()<2&&pinch>0){pinch=0;const k=Object.keys(pts)[0];if(k){cam.lx=pts[k].x;cam.ly=pts[k].y;}return;}
  if(!cam.drag)return;cam.drag=false;canvas.style.cursor='grab';
  if(!cam.moved&&e.type==='pointerup'){setMouse(e);pick();onClick();}
  if(e.pointerType==='touch')hasMouse=false;}
canvas.addEventListener('pointerup',pointerEnd);canvas.addEventListener('pointercancel',pointerEnd);
canvas.addEventListener('pointerleave',()=>{hasMouse=false;});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoomBy(1+clamp(e.deltaY,-300,300)*0.0012);},{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  auInit();if(!G||G.state==='title'||G.menu)return;
  const i='123456789'.indexOf(e.key);
  if(i>=0&&RUN.avail[i]){G.sel=RUN.avail[i];G.selTower=null;}
  else if(e.code==='Space'){e.preventDefault();roar();}
  else if((e.key==='u'||e.key==='U')&&G.selTower)tryUp(G.selTower);
  else if(e.key==='Escape')G.selTower=null;
});
function pick(){
  hover=null;if(!hasMouse)return;
  ray.setFromCamera(mouse,camera);
  if(towers.length){const h=ray.intersectObjects(towers.map(t=>t.grp),true);
    if(h.length){let o=h[0].object;while(o&&!o.userData.tower)o=o.parent;if(o){hover={c:o.userData.tower.c,tower:o.userData.tower};return;}}}
  if(ray.ray.intersectPlane(ground,_v1)){const c=cellAt(_v1.x,_v1.z);if(c)hover={c:c,tower:c.tower};}
}
function playing(){return G.state==='prep'||G.state==='wave'||G.state==='grow';}
function onClick(){
  if(!playing()||G.menu)return;
  if(!hover){G.selTower=null;return;}
  if(hover.tower){if(G.selTower===hover.tower)tryUp(hover.tower);else{G.selTower=hover.tower;sfx('tick');}return;}
  if(G.selTower){G.selTower=null;return;}
  if(!canBuild(hover.c)){toast(T('cantBuild'));sfx('no');return;}
  if(G.gold<tCost(G.sel)){needGold();return;}
  buildTower(G.sel,hover.c);
}
function updHover(){
  let st=G.selTower;
  if(st&&towers.indexOf(st)<0)st=G.selTower=null;
  if(st){const r=tStat(st).range;rangeRing.visible=true;rangeRing.position.set(st.wx,0.08,st.wz);rangeRing.scale.set(r,r,1);hl.visible=false;return;}
  if(!hover||(cam.moved&&cam.drag)||!playing()){hl.visible=false;rangeRing.visible=false;return;}
  const c=hover.c;
  if(hover.tower){const r2=tStat(hover.tower).range;hl.visible=false;rangeRing.visible=true;rangeRing.position.set(c.x+0.5,0.08,c.z+0.5);rangeRing.scale.set(r2,r2,1);return;}
  const ok=canBuild(c);
  hl.visible=true;hl.position.set(c.x+0.5,0.04,c.z+0.5);hl.material.color.setHex(ok?(G.gold>=tCost(G.sel)?0x69db7c:0xffd43b):0xff6b6b);
  rangeRing.visible=ok;if(ok){const r3=TOWERS[G.sel].range*RUN.range*(c.kind==='desert'?1.15:1);rangeRing.position.set(c.x+0.5,0.08,c.z+0.5);rangeRing.scale.set(r3,r3,1);}
}
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);
function updCamera(dt){
  let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
  for(let i=0;i<chunks.length;i++){const c=chunks[i];x0=Math.min(x0,c.ox);x1=Math.max(x1,c.ox+CH);z0=Math.min(z0,c.oz);z1=Math.max(z1,c.oz+CH);}
  const ext=Math.max(x1-x0,z1-z0),k=Math.min(1,dt*2.2);
  cam.cx+=((x0+x1)/2-cam.cx)*k;cam.cz+=((z0+z1)/2-cam.cz)*k;cam.base+=(10+1.55*ext-cam.base)*k;
  if(cam.idle>0)cam.idle-=dt;else if(!cam.drag&&(AUTO||G.state==='title'))cam.theta+=dt*0.05;
  const rr=cam.base*cam.zoom*Math.max(1,1/camera.aspect)*(window.innerHeight<480?1.22:1),sp=Math.sin(cam.phi);let sx=0,sy=0;
  if(G.shake>0){G.shake=Math.max(0,G.shake-dt*2.2);if(SV.shake){sx=(Math.random()-0.5)*G.shake*0.7;sy=(Math.random()-0.5)*G.shake*0.7;}}
  camera.position.set(cam.cx+Math.sin(cam.theta)*sp*rr+sx,Math.cos(cam.phi)*rr-1.5+sy,cam.cz+Math.cos(cam.theta)*sp*rr);
  camera.lookAt(cam.cx+sx,-1.5+sy,cam.cz);
  if(ext!==cam.ext){cam.ext=ext;const s=ext*0.75+7,sc=sun.shadow.camera;sc.left=-s;sc.right=s;sc.top=s;sc.bottom=-s;sc.updateProjectionMatrix();}
  sun.position.set(cam.cx+18,38,cam.cz+13);sun.target.position.set(cam.cx,0,cam.cz);
}

/* ---------------------------------------------------------------- loop */
newRun(!AUTO);applyLang();resize();
let last=performance.now(),stateT=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,Math.max(0.001,(now-last)/1000));last=now;
  updCamera(dt);camera.updateMatrixWorld();
  if(!G.menu&&!$('shop').classList.contains('show')){const steps=(playing()?G.spd:1)*SPEED;for(let i=0;i<steps;i++)update(dt);}
  const t=now/1000;
  cloudsA.rotation.y=t*0.012;cloudsB.rotation.y=-t*0.008;
  for(let i=0;i<islets.length;i++)islets[i].position.y=islets[i].userData.y+Math.sin(t*0.6+islets[i].userData.o)*0.5;
  flag.rotation.y=Math.sin(t*2.2)*0.35+0.3;
  const pg=portal.userData.glow;pg.material.opacity=0.6+Math.sin(t*4)*0.25;pg.scale.z=1+Math.sin(t*3)*0.06;
  pick();updHover();updHud();
  renderer.render(scene,camera);
  stateT-=dt;if(stateT<=0){stateT=0.5;document.documentElement.setAttribute('data-state',[G.state,'w'+G.wave,'hp'+G.hp,'g'+G.gold,'k'+G.kills,'t'+towers.length,'c'+chunks.length,'a'+RUN.avail.length,'b'+RUN.bosses,'s'+Math.round(G.t)].join(' '));}
}
updCamera(0.016);camera.updateMatrixWorld();
if(SIM>0){const log=[];let lw=0;
  while(G.t<SIM&&!((G.state==='over'||G.state==='win')&&G.endT<=0)){update(1/30);if(G.wave!==lw){lw=G.wave;log.push(Math.round(G.t)+'s:w'+lw+':hp'+G.hp+':g'+G.gold+':t'+towers.length+':b'+RUN.bosses+(RUN.revived?'R':''));}}
  document.documentElement.setAttribute('data-sim',log.join(' ')+' END '+[G.state,Math.round(G.t)+'s','w'+G.wave,'hp'+G.hp,'g'+G.gold,'k'+G.kills,'t'+towers.length,'e'+enemies.length,'c'+chunks.length,'b'+RUN.bosses,'kinds='+chunks.map(c=>c.kind[0]).join('')].join(' '));}
updHud();
requestAnimationFrame(frame);
})();
</script>
