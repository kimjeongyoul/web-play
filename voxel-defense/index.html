<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Baekho's Keep - Voxel Castle Defense</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;
  background:linear-gradient(#3f8fe0 0%,#7cc4f5 45%,#c9ecff 78%,#ffe9c4 100%);color:#2b2118;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.ui{position:fixed;pointer-events:none;z-index:5}
.ui>*{pointer-events:auto}
.panel{background:#fff7e0;border:3px solid #2b2118;border-radius:14px;box-shadow:0 4px 0 #2b2118}
#hud{top:10px;left:10px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.pill{padding:5px 12px 6px;min-width:84px;text-align:center;transition:transform .1s}
.pill small{display:block;font-size:10px;font-weight:800;letter-spacing:1.5px;color:#8a6d4b}
.pill span{font-size:22px;font-weight:900;line-height:1.05}
.pill.bad{background:#ffb3a8;transform:scale(1.08)}
#pGold span{color:#b97a00}
#hpBar{width:120px;height:9px;background:#3a2a20;border-radius:5px;margin:3px auto 0;overflow:hidden}
#hpFill{height:100%;width:100%;background:linear-gradient(#ff7b6b,#e03131);transition:width .25s}
#ctl{top:10px;right:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
button{font-family:inherit;cursor:pointer;color:#2b2118}
.btn{padding:9px 16px;font-size:15px;font-weight:900;border:3px solid #2b2118;border-radius:12px;box-shadow:0 4px 0 #2b2118;background:#ffd43b}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2b2118}
.btn.off{background:#d8d0bf;color:#857a66;cursor:default}
#bRoar{background:#ff922b;position:relative;overflow:hidden}
#bRoar i{position:absolute;left:0;top:0;bottom:0;background:rgba(43,33,24,.45);width:0}
#bSpd{background:#a5d8ff}
#cards{bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.card{position:relative;width:104px;padding:7px 6px 6px;text-align:center;background:#fff7e0;border:3px solid #2b2118;border-radius:14px;box-shadow:0 4px 0 #2b2118;transition:transform .12s}
.card.sel{background:#d3f9d8;transform:translateY(-8px);box-shadow:0 12px 0 -4px rgba(43,33,24,.25),0 4px 0 #2b2118}
.card.poor{filter:grayscale(.75);opacity:.75}
.card b{display:block;font-size:14px;font-weight:900}
.card small{display:block;font-size:10px;color:#7a6548;height:13px;white-space:nowrap}
.card em{display:inline-block;font-style:normal;font-weight:900;font-size:14px;color:#b97a00;margin-top:2px}
.card em:before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:#ffd43b;border:2px solid #2b2118;margin-right:4px;vertical-align:-1px}
.card kbd{position:absolute;top:4px;left:6px;font:900 10px inherit;color:#a08a68}
.ico{display:block;width:34px;height:34px;margin:0 auto 3px;border:3px solid #2b2118;border-radius:8px;position:relative}
.ico:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.ico.archer{background:#c98b4a}.ico.archer:after{width:20px;height:4px;background:#fff3d6;box-shadow:8px 0 0 -1px #2b2118}
.ico.cannon{background:#7d848c}.ico.cannon:after{width:14px;height:14px;border-radius:50%;background:#1f2326}
.ico.frost{background:#7fdcff}.ico.frost:after{width:12px;height:12px;background:#fff;transform:translate(-50%,-50%) rotate(45deg)}
.ico.tesla{background:#3b4252}.ico.tesla:after{width:6px;height:20px;background:#fff27a;transform:translate(-50%,-50%) skewX(-22deg)}
#info{bottom:118px;left:50%;transform:translateX(-50%);padding:8px 12px;display:none;gap:10px;align-items:center;white-space:nowrap}
#info b{font-size:15px}
#info .btn{padding:6px 12px;font-size:13px}
#info #bSell{background:#ffa8a8}
#banner{top:24%;left:0;right:0;text-align:center;font-size:64px;font-weight:900;color:#fff;letter-spacing:3px;
  text-shadow:0 5px 0 #2b2118,3px 0 0 #2b2118,-3px 0 0 #2b2118,0 -3px 0 #2b2118,3px 5px 0 #2b2118,-3px 5px 0 #2b2118;opacity:0}
#banner.go{animation:ban 2.4s ease-out forwards}
#banner.boss{color:#ff6b6b}
@keyframes ban{0%{opacity:0;transform:scale(2.2)}12%{opacity:1;transform:scale(1)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9) translateY(-20px)}}
#toast{top:40%;left:0;right:0;text-align:center;font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 0 #2b2118,2px 0 0 #2b2118,-2px 0 0 #2b2118,0 -2px 0 #2b2118;opacity:0;transition:opacity .25s}
#hint{bottom:118px;left:0;right:0;text-align:center;font-size:14px;font-weight:800;color:#fff;text-shadow:0 2px 0 #2b2118,1px 0 0 #2b2118,-1px 0 0 #2b2118,0 -1px 0 #2b2118;transition:opacity .6s}
#autoTag{bottom:12px;left:12px;padding:4px 10px;font-size:12px;font-weight:900;background:#2b2118;color:#ffd43b;border-radius:8px;display:none}
#flash{inset:0;background:radial-gradient(transparent 45%,rgba(224,49,49,.75));opacity:0;transition:opacity .35s;z-index:4}
#end{inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,14,10,.55);z-index:20}
#end .panel{padding:26px 40px 28px;text-align:center;min-width:300px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
#end h1{font-size:44px;font-weight:900;margin-bottom:4px}
#end.win h1{color:#e8a200}#end.lose h1{color:#c92a2a}
#end p{font-size:14px;color:#7a6548;margin-bottom:14px;font-weight:700}
#end table{margin:0 auto 18px;font-size:17px;font-weight:800;border-spacing:14px 3px}
#end td:last-child{text-align:right;color:#b97a00}
#end td:first-child{text-align:left}
#end .btn{font-size:19px;padding:11px 28px}
@media (max-width:640px){
  .pill{min-width:62px;padding:4px 7px}.pill span{font-size:17px}#hpBar{width:70px}
  .btn{padding:7px 10px;font-size:12px}#ctl{top:auto;bottom:128px}
  .card{width:78px}.card small{display:none}#banner{font-size:40px}#hint{display:none}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash" class="ui"></div>
<div id="hud" class="ui">
  <div class="pill panel"><small>WAVE</small><span id="vWave">0/10</span></div>
  <div class="pill panel" id="pGold"><small>GOLD</small><span id="vGold">0</span></div>
  <div class="pill panel" id="pHp"><small>CASTLE HP</small><span id="vHp">20</span><div id="hpBar"><div id="hpFill"></div></div></div>
  <div class="pill panel"><small>DEFEATED</small><span id="vKills">0</span></div>
</div>
<div id="ctl" class="ui">
  <button class="btn" id="bWave">START WAVE</button>
  <button class="btn" id="bRoar"><i></i><span style="position:relative">TIGER ROAR</span></button>
  <button class="btn" id="bSpd">SPEED x1</button>
</div>
<div id="banner" class="ui"></div>
<div id="toast" class="ui"></div>
<div id="hint" class="ui">Click a grass tile to build &nbsp;|&nbsp; Click a tower to upgrade &nbsp;|&nbsp; Drag to rotate, wheel to zoom</div>
<div id="info" class="ui panel"><b id="iName"></b><button class="btn" id="bUp"></button><button class="btn" id="bSell"></button></div>
<div id="cards" class="ui"></div>
<div id="autoTag" class="ui">AUTO PLAY</div>
<div id="end" class="ui"><div class="panel"><h1 id="eTitle"></h1><p id="eSub"></p><table id="eStats"></table><button class="btn" id="bAgain">PLAY AGAIN</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
window.addEventListener('error',function(e){document.documentElement.setAttribute('data-err',String(e.message||e));});
if(!window.THREE){$('toast').style.opacity=1;$('toast').textContent='Could not load three.js (check the network).';return;}

var Q=new URLSearchParams(location.search);
var AUTO=Q.has('auto');
var SPEED=Math.max(1,Math.min(60,parseInt(Q.get('speed'),10)||1));
var seed=20261124;
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
function R(a,b){return a+Math.random()*(b-a);}

/* ---------------------------------------------------------------- renderer */
var canvas=$('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(0x000000,0);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(40,1,0.5,400);
scene.add(new THREE.HemisphereLight(0xffffff,0x7f8fb5,0.78));
var sun=new THREE.DirectionalLight(0xfff1d6,0.82);
sun.position.set(16,34,12);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-24;sun.shadow.camera.right=24;sun.shadow.camera.top=24;sun.shadow.camera.bottom=-24;
sun.shadow.camera.near=1;sun.shadow.camera.far=90;sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.03;
scene.add(sun);

/* ---------------------------------------------------------------- voxel helpers */
var TB=new THREE.BoxGeometry(1,1,1),TP=TB.attributes.position.array,TN=TB.attributes.normal.array,TI=TB.index.array;
var _c=new THREE.Color();
function buildGeo(list){
  var n=list.length,pos=new Float32Array(n*72),nor=new Float32Array(n*72),col=new Float32Array(n*72),idx=new Uint32Array(n*36);
  for(var i=0;i<n;i++){
    var b=list[i];_c.setHex(b[6]);
    for(var v=0;v<24;v++){
      var o=i*72+v*3,s=v*3;
      pos[o]=TP[s]*b[3]+b[0];pos[o+1]=TP[s+1]*b[4]+b[1];pos[o+2]=TP[s+2]*b[5]+b[2];
      nor[o]=TN[s];nor[o+1]=TN[s+1];nor[o+2]=TN[s+2];
      col[o]=_c.r;col[o+1]=_c.g;col[o+2]=_c.b;
    }
    for(var k=0;k<36;k++)idx[i*36+k]=TI[k]+i*24;
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.setIndex(new THREE.BufferAttribute(idx,1));
  return g;
}
var VM=new THREE.MeshLambertMaterial({vertexColors:true});
var VB=new THREE.MeshBasicMaterial({vertexColors:true});
function vmesh(geo,mat,noShadow){var m=new THREE.Mesh(geo,mat||VM);if(!noShadow){m.castShadow=true;m.receiveShadow=true;}return m;}
function vox(list,mat,noShadow){return vmesh(buildGeo(list),mat,noShadow);}
/* box with bottom at y0 */
function bx(L,x,y0,z,w,h,d,c){L.push([x,y0+h/2,z,w,h,d,c]);}
function J(hex,a){var k=1+(rnd()-0.5)*a;
  var r=Math.min(255,((hex>>16)&255)*k)|0,g=Math.min(255,((hex>>8)&255)*k)|0,b=Math.min(255,(hex&255)*k)|0;return (r<<16)|(g<<8)|b;}

/* ---------------------------------------------------------------- world data */
var N=26,OFF=13;
function tx(g){return g-OFF+0.5;}
var TG=0,TPATH=1,TW=2,TC=3,TBR=4;
var tile=[],hgt=[],topK=[],botK=[],treeAt=[],towerGrid=[];
function inIsland(x,z){
  if(x<0||z<0||x>=N||z>=N)return false;
  var Rr=5,px=x+0.5,pz=z+0.5;
  var qx=Math.max(Rr-px,px-(N-Rr),0),qz=Math.max(Rr-pz,pz-(N-Rr),0);
  return qx*qx+qz*qz<=Rr*Rr;
}
var x,z,i,k;
for(x=0;x<N;x++){tile[x]=[];hgt[x]=[];topK[x]=[];botK[x]=[];treeAt[x]=[];towerGrid[x]=[];
  for(z=0;z<N;z++){tile[x][z]=TG;hgt[x][z]=0;treeAt[x][z]=false;towerGrid[x][z]=null;}}
/* river */
for(z=0;z<N;z++){var rx=12+Math.round(1.6*Math.sin(z*0.4));tile[rx][z]=TW;tile[rx+1][z]=TW;}
/* path */
var WP=[[0,4],[6,4],[6,11],[2,11],[2,19],[8,19],[8,15],[16,15],[16,21],[21,21],[21,9],[17,9],[17,4]];
var pathCells=[];
for(i=0;i<WP.length-1;i++){
  var ax=WP[i][0],az=WP[i][1],bx_=WP[i+1][0],bz_=WP[i+1][1],sx=Math.sign(bx_-ax),sz=Math.sign(bz_-az);
  var cx=ax,cz=az;
  for(;;){
    if(tile[cx][cz]===TW)tile[cx][cz]=TBR;else if(tile[cx][cz]===TG)tile[cx][cz]=TPATH;
    if(!pathCells.some(function(p){return p[0]===cx&&p[1]===cz;}))pathCells.push([cx,cz]);
    if(cx===bx_&&cz===bz_)break;cx+=sx;cz+=sz;
  }
}
/* castle footprint */
var CX0=18,CX1=24,CZ0=1,CZ1=7;
for(x=CX0;x<=CX1;x++)for(z=CZ0;z<=CZ1;z++)tile[x][z]=TC;
/* hills */
for(x=0;x<N;x++)for(z=0;z<N;z++){
  if(!inIsland(x,z)||tile[x][z]!==TG)continue;
  var ok=true;
  for(var dx=-2;dx<=2&&ok;dx++)for(var dz=-2;dz<=2;dz++){var nx=x+dx,nz=z+dz;if(nx<0||nz<0||nx>=N||nz>=N)continue;if(tile[nx][nz]!==TG){ok=false;break;}}
  if(!ok)continue;
  var v=Math.sin(x*0.55+0.8)*Math.sin(z*0.5+2.1)+0.5*Math.sin(x*0.23+z*0.31);
  hgt[x][z]=v>0.95?2:v>0.45?1:0;
}
/* depth below */
var dist=[];
for(x=0;x<N;x++){dist[x]=[];for(z=0;z<N;z++)dist[x][z]=inIsland(x,z)?99:0;}
function dAt(a,b){return (a<0||b<0||a>=N||b>=N)?0:dist[a][b];}
for(var pass=0;pass<16;pass++)for(x=0;x<N;x++)for(z=0;z<N;z++){
  if(!dist[x][z])continue;
  var m=Math.min(dAt(x-1,z),dAt(x+1,z),dAt(x,z-1),dAt(x,z+1))+1;if(m<dist[x][z])dist[x][z]=m;}
for(x=0;x<N;x++)for(z=0;z<N;z++){
  var w=tile[x][z]===TW||tile[x][z]===TBR;
  topK[x][z]=w?-2:hgt[x][z]-1;
  botK[x][z]=-(3+Math.floor(dist[x][z]*0.95+rnd()*1.7));
}
function solid(a,kk,b){return inIsland(a,b)&&kk<=topK[a][b]&&kk>=botK[a][b];}

/* ---------------------------------------------------------------- island mesh */
(function(){
  var L=[];
  for(var x=0;x<N;x++)for(var z=0;z<N;z++){
    if(!inIsland(x,z))continue;
    var t=tile[x][z],top=topK[x][z];
    for(var k=top;k>=botK[x][z];k--){
      if(solid(x+1,k,z)&&solid(x-1,k,z)&&solid(x,k,z+1)&&solid(x,k,z-1)&&solid(x,k+1,z)&&solid(x,k-1,z))continue;
      var c;
      if(k===top){
        if(t===TPATH)c=J(((x+z)&1)?0xcfa468:0xc49a5a,0.07);
        else if(t===TW||t===TBR)c=J(0xd9c58a,0.08);
        else if(t===TC)c=J(0xa9a297,0.06);
        else c=J(((x+z)&1)?0x6cc24a:0x62b844,0.06);
      }else if(k>=top-2&&k>-4)c=J(0x8a5a35,0.12);
      else c=rnd()<0.04?J(0x5fb3c9,0.1):J(0x7b7f8a,0.14);
      L.push([tx(x),k+0.5,tx(z),1,1,1,c]);
    }
  }
  scene.add(vox(L));
})();

/* pick boxes (one per column) */
var pickTiles=[],pickMesh;
(function(){
  var L=[];
  for(var x=0;x<N;x++)for(var z=0;z<N;z++){
    if(!inIsland(x,z))continue;
    var top=(tile[x][z]===TW||tile[x][z]===TBR)?-0.3:hgt[x][z];
    L.push([tx(x),top-1.5,tx(z),1,3,1,0xffffff]);pickTiles.push([x,z]);
  }
  pickMesh=new THREE.Mesh(buildGeo(L),new THREE.MeshBasicMaterial());
  pickMesh.updateMatrixWorld();
})();

/* ---------------------------------------------------------------- water, bridge, deco */
var waterMat=new THREE.MeshLambertMaterial({color:0x3fa9f5,transparent:true,opacity:0.8});
var fallMat=new THREE.MeshLambertMaterial({color:0x8fd3ff,transparent:true,opacity:0.62});
var waterMesh,foam=[];
(function(){
  var L=[],F=[],x,z;
  for(x=0;x<N;x++)for(z=0;z<N;z++)if(tile[x][z]===TW||tile[x][z]===TBR)L.push([tx(x),-0.66,tx(z),1,0.68,1,0xffffff]);
  waterMesh=new THREE.Mesh(buildGeo(L),waterMat);waterMesh.receiveShadow=true;scene.add(waterMesh);
  [[0,-OFF-0.16],[N-1,OFF+0.16]].forEach(function(e){
    var xs=[];for(x=0;x<N;x++)if(tile[x][e[0]]===TW)xs.push(x);
    var xc=(tx(xs[0])+tx(xs[xs.length-1]))/2,wd=xs.length;
    F.push([xc,-8.3,e[1],wd,16,0.3,0xffffff]);
    for(var j=0;j<14;j++){
      var m=new THREE.Mesh(TB,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.85}));
      m.scale.set(R(0.12,0.3),R(0.3,0.8),0.12);
      m.userData={x:xc+R(-wd/2+0.15,wd/2-0.15),z:e[1]+(e[1]<0?-0.2:0.2),o:Math.random()*16,s:R(5,8)};
      scene.add(m);foam.push(m);
    }
  });
  scene.add(new THREE.Mesh(buildGeo(F),fallMat));
})();

var decoList=[];
(function(){
  var L=decoList,x,z;
  /* bridge */
  var bxs=[];for(x=0;x<N;x++)for(z=0;z<N;z++)if(tile[x][z]===TBR)bxs.push([x,z]);
  if(bxs.length){
    var bz=bxs[0][1],x0=tx(bxs[0][0])-0.5,x1=tx(bxs[bxs.length-1][0])+0.5,zc=tx(bz);
    for(var p=x0+0.15;p<x1;p+=0.34)bx(L,p,-0.06,zc,0.3,0.16,1.36,J(0xa9713d,0.16));
    bx(L,(x0+x1)/2,-0.3,zc-0.5,x1-x0+0.3,0.2,0.14,0x6e4424);bx(L,(x0+x1)/2,-0.3,zc+0.5,x1-x0+0.3,0.2,0.14,0x6e4424);
    [zc-0.66,zc+0.66].forEach(function(zz){
      for(var q=x0-0.1;q<=x1+0.11;q+=(x1-x0+0.2)/3)bx(L,q,-1,zz,0.16,1.75,0.16,0x7a4b26);
      bx(L,(x0+x1)/2,0.56,zz,x1-x0+0.4,0.1,0.1,0x8f5a2e);bx(L,(x0+x1)/2,0.3,zz,x1-x0+0.4,0.07,0.07,0x8f5a2e);
    });
  }
  /* trees, flowers, rocks */
  function nearPath(x,z){for(var a=-1;a<=1;a++)for(var b=-1;b<=1;b++){var nx=x+a,nz=z+b;if(nx<0||nz<0||nx>=N||nz>=N)continue;var t=tile[nx][nz];if(t!==TG)return true;}return false;}
  for(x=0;x<N;x++)for(z=0;z<N;z++){
    if(!inIsland(x,z)||tile[x][z]!==TG)continue;
    var y=hgt[x][z],np=nearPath(x,z),pr=y>0?0.34:np?0.035:0.15,r=rnd();
    var wx=tx(x)+(rnd()-0.5)*0.2,wz=tx(z)+(rnd()-0.5)*0.2;
    if(r<pr){
      treeAt[x][z]=true;var s=0.85+rnd()*0.5,kind=rnd();
      if(kind<0.45){var g=[0x3f9b3a,0x4caf50,0x2f8f46][(rnd()*3)|0];
        bx(L,wx,y,wz,0.28,1.0*s,0.28,J(0x7a5230,0.1));bx(L,wx,y+0.85*s,wz,1.15*s,0.62*s,1.15*s,J(g,0.1));bx(L,wx,y+1.47*s,wz,0.78*s,0.45*s,0.78*s,J(g,0.14));bx(L,wx,y+1.92*s,wz,0.4*s,0.25*s,0.4*s,J(g,0.14));
      }else if(kind<0.82){
        bx(L,wx,y,wz,0.24,0.7*s,0.24,J(0x6b4423,0.1));

function bestSpot(type){
  var r=TOWERS[type].range,r2=r*r,best=null,bs=-1;

    if(!canBuild(x,z))continue;

function update(dt){

    if(G.endT>0){G.endT-=dt;if(G.endT<=0)showEnd();}
    if(G.state==='win'&&Math.random()<dt*5)burst(tx(21)+R(-5,5),R(8,13),tx(4)+R(-5,5),[0xff6b6b,0xffd43b,0x74c0fc,0x8ce99a,0xf783ac][(Math.random()*5)|0],26,5,0.2,0.35,1.1);

    updEnemiesIdle(dt);updHero(dt);updShots(dt);updFx(dt);return;
  }
  if(G.state==='prep'||G.state==='between'){G.cd-=dt;if(G.cd<=0)startWave();}
  if(G.state==='wave'){
    G.waveT+=dt;
    while(G.queue.length&&G.queue[0].t<=G.waveT)spawnEnemy(G.queue.shift().type);
  }
  if(AUTO)autoTick(dt);
  updEnemies(dt);updTowers(dt);updHero(dt);updShots(dt);updFx(dt);
  if(G.state==='wave'&&!G.queue.length&&!enemies.length){
    if(G.wave>=10)endGame(true);
    else{var bonus=25+5*G.wave;G.gold+=bonus;G.state='between';G.cd=AUTO?4:14;toast('Wave '+G.wave+' cleared!  +'+bonus+' gold');}

  if(objs.length){var h=ray.intersectObjects(objs,true);if(h.length){var o=h[0].object;while(o&&!o.userData.tower)o=o.parent;if(o)th={t:o.userData.tower,d:h[0].distance};}}
  var hits=ray.intersectObject(pickMesh);
  if(th&&(!hits.length||th.d<hits[0].distance+0.4)){hover={x:th.t.x,z:th.t.z,tower:th.t};return;}
  if(hits.length){var p=pickTiles[Math.floor(hits[0].faceIndex/12)];if(p)hover={x:p[0],z:p[1],tower:towerGrid[p[0]][p[1]]};}
}
function onClick(){
  if(G.state==='over'||G.state==='win')return;
  if(!hover){G.selTower=null;return;}
  if(hover.tower){G.selTower=G.selTower===hover.tower?null:hover.tower;return;}
  if(G.selTower){G.selTower=null;return;}
  if(!canBuild(hover.x,hover.z)){toast(treeAt[hover.x]&&treeAt[hover.x][hover.z]?'A tree is in the way':'Build on open grass');return;}
  if(G.gold<TOWERS[G.sel].cost){needGold();return;}
  if(buildTower(G.sel,hover.x,hover.z)){G.built++;$('hint').style.opacity=0;}
}
function updHover(){
  var st=G.selTower;
  if(st&&towers.indexOf(st)<0)st=G.selTower=null;
  if(st){var r=tStat(st).range;rangeRing.visible=true;rangeRing.position.set(st.wx,st.wy+0.08,st.wz);rangeRing.scale.set(r,r,1);hl.visible=false;return;}
  if(!hover||cam.moved&&cam.drag||G.state==='over'||G.state==='win'){hl.visible=false;rangeRing.visible=false;return;}
  var t=tile[hover.x][hover.z],y=(t===TW||t===TBR)?-0.28:hgt[hover.x][hover.z];
  if(hover.tower){var r2=tStat(hover.tower).range;hl.visible=false;rangeRing.visible=true;rangeRing.position.set(tx(hover.x),y+0.08,tx(hover.z));rangeRing.scale.set(r2,r2,1);return;}
  var ok=canBuild(hover.x,hover.z);
  hl.visible=true;hl.position.set(tx(hover.x),y+0.04,tx(hover.z));hl.material.color.setHex(ok?(G.gold>=TOWERS[G.sel].cost?0x69db7c:0xffd43b):0xff6b6b);
  rangeRing.visible=ok;if(ok){var r3=TOWERS[G.sel].range;rangeRing.position.set(tx(hover.x),y+0.08,tx(hover.z));rangeRing.scale.set(r3,r3,1);}
}
function resize(){
  var w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();
function updCamera(dt){
  if(cam.idle>0)cam.idle-=dt;else if(!cam.drag)cam.theta+=dt*0.045;
  var rr=cam.r*Math.max(1,1.25/camera.aspect);
  var sp=Math.sin(cam.phi),sx=0,sy=0;
  if(G.shake>0){G.shake=Math.max(0,G.shake-dt*2.2);sx=(Math.random()-0.5)*G.shake*0.7;sy=(Math.random()-0.5)*G.shake*0.7;}
  camera.position.set(Math.sin(cam.theta)*sp*rr+sx,Math.cos(cam.phi)*rr-1.5+sy,Math.cos(cam.theta)*sp*rr);
  camera.lookAt(sx,-1.5+sy,0);
}

/* ---------------------------------------------------------------- loop */
var last=performance.now(),stateT=0;
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,Math.max(0.001,(now-last)/1000));last=now;
  updCamera(dt);camera.updateMatrixWorld();
  var steps=G.spd*SPEED;
  for(var i=0;i<steps;i++)update(dt);
  var t=now/1000;
  waterMesh.position.y=Math.sin(t*1.6)*0.035;waterMat.opacity=0.78+Math.sin(t*2.3)*0.05;
  for(i=0;i<foam.length;i++){var f=foam[i],u=f.userData,yy=(u.o+t*u.s)%16;f.position.set(u.x,-0.4-yy,u.z);f.material.opacity=0.85*(1-yy/16);}
  cloudsA.rotation.y=t*0.012;cloudsB.rotation.y=-t*0.008;
  for(i=0;i<islets.length;i++)islets[i].position.y=islets[i].userData.y+Math.sin(t*0.6+islets[i].userData.o)*0.5;
  flag.rotation.y=Math.sin(t*2.2)*0.35+0.3;
  portal.material.opacity=0.6+Math.sin(t*4)*0.25;portal.scale.z=1+Math.sin(t*3)*0.06;
  pick();updHover();updHud();
  renderer.render(scene,camera);
  stateT-=dt;if(stateT<=0){stateT=0.5;document.documentElement.setAttribute('data-state',[G.state,'w'+G.wave,'hp'+G.hp,'g'+G.gold,'k'+G.kills,'t'+towers.length].join(' '));}
}
updCamera(0.016);camera.updateMatrixWorld();
var SIM=parseFloat(Q.get('sim'))||0;
if(SIM>0){var log=[],lw=0;while(G.t<SIM&&G.endT<=0&&!(G.state==='over'||G.state==='win')){update(1/30);if(G.wave!==lw){lw=G.wave;log.push(Math.round(G.t)+'s:w'+lw+':hp'+G.hp+':g'+G.gold+':t'+towers.length);}}
  document.documentElement.setAttribute('data-sim',log.join(' ')+' END '+[G.state,Math.round(G.t)+'s','w'+G.wave,'hp'+G.hp,'g'+G.gold,'k'+G.kills,'t'+towers.length,'e'+enemies.length].join(' '));}
updHud();
requestAnimationFrame(frame);
})();
</script>
