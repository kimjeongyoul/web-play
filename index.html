<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>미리 해 보기</title>
<style>
  :root { --bg: #1d1a24; --card: #2b2635; --text: #f3eefc; --dim: #a79fb8; --accent: #ffb547; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Malgun Gothic", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: var(--dim); margin: 0 0 24px; line-height: 1.5; }
  .game { display: block; background: var(--card); border-radius: 14px; padding: 18px; margin-bottom: 12px; color: var(--text); text-decoration: none; }
  .game strong { color: var(--accent); }
  .soon { color: var(--dim); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>미리 해 보기</h1>
  <p>만들고 있는 게임이에요. 지금은 컴퓨터에서 하는 게 가장 좋아요. 핸드폰은 가로로 돌려서, 터치 조작은 만드는 중이에요.</p>
  <a class="game" href="survivor/"><strong>로그라이크</strong><div class="soon">몰려오는 적, 터지는 화면 · 핸드폰은 가로로, 끌어서 이동</div></a>
  <a class="game" href="defense/"><strong>디펜스</strong><div class="soon">층마다 바뀌는 땅과 규칙 · 핸드폰 터치 조작 만드는 중</div></a>
</main>
</body>
</html>
