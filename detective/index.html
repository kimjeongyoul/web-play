<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
        <title>Yes No Detective</title>
        <style>
            html, body, #canvas {
                margin: 0;
                padding: 0;
                border: 0;
            }

            body {
                color: white;
                background-color: #14100c;
                overflow: hidden;
                touch-action: none;
                -webkit-user-select: none;
                user-select: none;
                -webkit-touch-callout: none;
            }

            #canvas {
                display: block;
            }

            #canvas:focus {
                outline: none;
            }

            #status, #status-splash, #status-progress {
                position: absolute;
                left: 0;
                right: 0;
            }

            #status, #status-splash {
                top: 0;
                bottom: 0;
            }

            #status {
                background-color: #14100c;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 9000;
            }

            #status-splash {
                max-height: 100%;
                max-width: 100%;
                margin: auto;
            }

            #status-notice {
                display: none;
            }

            #loader {
                position: absolute;
                left: 50%;
                bottom: max(7%, 24px);
                transform: translateX(-50%);
                box-sizing: border-box;
                width: min(88vw, 480px);
                padding: 16px 24px 18px;
                border-radius: 16px;
                background-color: rgba(20, 16, 12, 0.86);
                color: white;
                font-family: 'Noto Sans', 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif;
                text-align: center;
            }

            #loader-percent {
                font-size: 32px;
                font-weight: 700;
                line-height: 1.2;
            }

            #loader-bar {
                position: relative;
                overflow: hidden;
                height: 18px;
                margin: 10px 0 12px;
                border-radius: 9px;
                background-color: rgba(255, 255, 255, 0.18);
            }

            #loader-fill {
                height: 100%;
                width: 0;
                border-radius: 9px;
                background-color: #f0c46a;
                transition: width 0.2s linear;
            }

            /* Runs on the compositor, so it keeps moving while the engine holds the page's one thread. */
            #loader-shine {
                display: none;
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                width: 35%;
                background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0));
                will-change: transform;
                animation: loader-shine 1.1s linear infinite;
            }

            #loader.starting #loader-shine {
                display: block;
            }

            @keyframes loader-shine {
                from { transform: translateX(-100%); }
                to { transform: translateX(290%); }
            }

            #loader-text {
                font-size: 22px;
                line-height: 1.3;
            }

            /* The seconds too: the engine's start holds the thread, so no timer in the page would tick. */
            #loader-count {
                display: inline-block;
                overflow: hidden;
                height: 1.3em;
                min-width: 1.2em;
                margin: 0 0.25em;
                vertical-align: bottom;
            }

            #loader-digits {
                display: block;
                will-change: transform;
                animation: loader-count 120s steps(120) forwards;
            }

            @keyframes loader-count {
                to { transform: translateY(-100%); }
            }

            #status-notice {
                background-color: #5b3943;
                border-radius: 0.5rem;
                border: 1px solid #9b3943;
                color: #e0e0e0;
                font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
                line-height: 1.3;
                margin: 0 2rem;
                overflow: hidden;
                padding: 1rem;
                text-align: center;
                z-index: 1;
            }

        </style>
        <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    </head>
    <body>
        <canvas id="canvas">
            Your browser does not support the canvas tag.
        </canvas>

        <noscript>
            Your browser does not support JavaScript.
        </noscript>

        <div id="status">
            <img id="status-splash" src="index.png" alt="">
            <div id="loader">
                <div id="loader-percent">0%</div>
                <div id="loader-bar"><div id="loader-fill"></div><div id="loader-shine"></div></div>
                <div id="loader-text"></div>
            </div>
            <div id="status-notice"></div>
        </div>

        <script>
            // The page's own loading screen; Bridge's logo is turned off in playgama-bridge-config.json.
            const LOADER_TEXT = {
                en: { loading: 'Loading…', starting: 'Starting…', seconds: 's' },
                ko: { loading: '불러오는 중…', starting: '시작하는 중…', seconds: '초' },
                es: { loading: 'Cargando…', starting: 'Iniciando…', seconds: 's' },
                pt: { loading: 'Carregando…', starting: 'Iniciando…', seconds: 's' },
                ru: { loading: 'Загрузка…', starting: 'Запуск…', seconds: 'с' },
                tr: { loading: 'Yükleniyor…', starting: 'Başlatılıyor…', seconds: 'sn' },
                de: { loading: 'Wird geladen…', starting: 'Wird gestartet…', seconds: 's' },
                fr: { loading: 'Chargement…', starting: 'Démarrage…', seconds: 's' },
                ja: { loading: '読み込み中…', starting: '起動中…', seconds: '秒' },
                zh: { loading: '加载中…', starting: '正在启动…', seconds: '秒' },
            }
            const LOADER_SECONDS = Array.from({ length: 120 }, (_, second) => second).join('<br>')
            // If the game never says it is ready, it is shown anyway instead of being covered for good.
            const LOADER_GIVE_UP_MSEC = 30000
            let loaderLanguage = LOADER_TEXT[(navigator.language || '').slice(0, 2).toLowerCase()] ? (navigator.language || '').slice(0, 2).toLowerCase() : 'en'
            let loaderPercent = 0
            let loaderStarted = false

            function drawLoader() {
                const text = LOADER_TEXT[loaderLanguage]
                document.getElementById('loader-percent').textContent = `${loaderPercent}%`
                document.getElementById('loader-fill').style.width = `${loaderPercent}%`
                document.getElementById('loader-text').innerHTML = loaderStarted
                    ? `${text.starting}<span id="loader-count"><span id="loader-digits">${LOADER_SECONDS}</span></span>${text.seconds}`
                    : text.loading
            }

            function setLoaderLanguage(language) {
                loaderLanguage = LOADER_TEXT[language] ? language : 'en'
                drawLoader()
            }

            function setLoaderProgress(current, total) {
                // The engine's last call, with current equal to total, comes only after the game has started.
                const done = total > 0 && current / total >= 0.999
                if (!document.getElementById('status') || !total) {
                    return
                }
                loaderPercent = done ? 100 : Math.max(loaderPercent, Math.floor(current * 100 / total))
                if (done && !loaderStarted) {
                    loaderStarted = true
                    document.getElementById('loader').classList.add('starting')
                }
                if (!loaderStarted || done) {
                    drawLoader()
                }
            }

            // The game calls this with its first scene on screen (scripts/autoload/playgama.gd).
            window.hideLoader = function () {
                document.getElementById('status').remove()
                window.hideLoader = function () {}
            }

            drawLoader()
        </script>
        <script>
// Goes into the Playgama page ahead of index.js (tools/export_web.py). The engine's two big files start
// downloading here, while the Bridge SDK is still loading, and the engine's own requests take them.
// The server there does not compress, so index.wasm comes from index.wasm.gz, unpacked on the way in. The first
// bytes decide: gzip is unpacked, a wasm (the server already unpacked it) is used as it is, anything else or a
// browser without DecompressionStream (Safari before 16.4) takes index.wasm. The engine counts the unpacked
// bytes, so its progress still matches fileSizes.
(function () {
	var plain = window.fetch;
	if (!plain) {
		return;
	}
	function unpack(url) {
		return plain.call(window, url + '.gz').then(function (response) {
			if (!response.ok || !response.body) {
				throw new Error('no ' + url + '.gz');
			}
			var reader = response.body.getReader();
			return reader.read().then(function (first) {
				var head = first.value;
				var gzip = head && head[0] === 0x1f && head[1] === 0x8b;
				var wasm = head && head[0] === 0x00 && head[1] === 0x61 && head[2] === 0x73 && head[3] === 0x6d;
				if (!gzip && !wasm) {
					reader.cancel();
					throw new Error('not a wasm: ' + url + '.gz');
				}
				var body = new ReadableStream({
					start: function (controller) {
						controller.enqueue(head);
					},
					pull: function (controller) {
						return reader.read().then(function (next) {
							if (next.done) {
								controller.close();
							} else {
								controller.enqueue(next.value);
							}
						});
					},
					cancel: function (reason) {
						return reader.cancel(reason);
					},
				});
				if (gzip) {
					body = body.pipeThrough(new DecompressionStream('gzip'));
				}
				return new Response(body, { headers: { 'Content-Type': 'application/wasm' } });
			});
		});
	}
	function wasmFile() {
		if (typeof DecompressionStream === 'undefined') {
			return plain.call(window, 'index.wasm');
		}
		return unpack('index.wasm').catch(function () {
			return plain.call(window, 'index.wasm');
		});
	}
	var early = { 'index.wasm': wasmFile(), 'index.pck': plain.call(window, 'index.pck') };
	window.fetch = function (input) {
		var waiting = early[input];
		if (waiting) {
			// Once: the engine asks again only to retry a failed download.
			delete early[input];
			return waiting;
		}
		if (input === 'index.wasm') {
			return wasmFile();
		}
		return plain.apply(window, arguments);
	};
	early['index.wasm'].catch(function () {});
	early['index.pck'].catch(function () {});
})();
</script>
<script src="index.js"></script>
        <script>
            const GODOT_CONFIG = Object.assign({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":8983812,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4}, { persistentPaths: [] })
            const ENGINE = new Engine(GODOT_CONFIG)
            const CANVAS = document.getElementById('canvas')

            let bridgeScript = null
            let bridgeTimeout = null
            let bridgeLoaded = false

            function addLocalBridge() {
                if (bridgeLoaded) return
                bridgeLoaded = true
                clearTimeout(bridgeTimeout)

                if (bridgeScript && bridgeScript.parentNode) {
                    bridgeScript.onload = null
                    bridgeScript.onerror = null
                    bridgeScript.parentNode.removeChild(bridgeScript)
                }

                window.bridge = null
                window.playgamaBridge = null

                const scriptElement = document.createElement('script')
                scriptElement.src = './playgama-bridge.js'
                scriptElement.onload = function() {
                    initializeBridge()
                }
                document.body.appendChild(scriptElement)
            }

            bridgeScript = document.createElement('script')
            bridgeScript.src = 'https://bridge.playgama.com/v2/stable/playgama-bridge.js'
            bridgeScript.onload = initializeBridge
            bridgeScript.onerror = addLocalBridge

            bridgeTimeout = setTimeout(() => {
                console.warn('CDN bridge failed to load within 2 seconds, loading local bridge')
                addLocalBridge()
            }, 2000)

            document.head.appendChild(bridgeScript)

            function initializeBridge() {
                clearTimeout(bridgeTimeout)
                bridge.engine = 'godot-4'
                bridge.initialize().then(() => bridge.storage.get('yes_no_detective', false).catch(() => null)).then((saved) => {
                    window.__gameSave = typeof saved === 'string' ? saved : ''
                    setLoaderLanguage(bridge.platform.language)
                    bridge.setGameLoadingProgress(0)
                    ENGINE.startGame({
                        onProgress: function (current, total) {
                            bridge.setGameLoadingProgress((current / total) * 100);
                            setLoaderProgress(current, total)
                        },
                    }).then(() => {
                        CANVAS.focus()
                        setTimeout(() => window.hideLoader(), LOADER_GIVE_UP_MSEC)
                    });
                })
            }
        </script>

    </body>
</html>
